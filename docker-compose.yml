services:
  backend:
    build:
      context: ./backend
    container_name: stock-tracker-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_MAIL_HOST: "${SPRING_MAIL_HOST:-}"
      SPRING_MAIL_PORT: "${SPRING_MAIL_PORT:-587}"
      SPRING_MAIL_USERNAME: "${SPRING_MAIL_USERNAME:-}"
      SPRING_MAIL_PASSWORD: "${SPRING_MAIL_PASSWORD:-}"
      SPRING_MAIL_SMTP_AUTH: "${SPRING_MAIL_SMTP_AUTH:-true}"
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: "${SPRING_MAIL_SMTP_STARTTLS_ENABLE:-true}"
      APP_SCHEDULER_TIMEZONE: "${APP_SCHEDULER_TIMEZONE:-Asia/Kolkata}"
      APP_SCHEDULER_HOURLY_ENABLED: "${APP_SCHEDULER_HOURLY_ENABLED:-false}"
      APP_SCHEDULER_HOURLY_CRON: "${APP_SCHEDULER_HOURLY_CRON:-0 5 10-15 ? * MON-FRI}"
      APP_SCHEDULER_DAILY_ENABLED: "${APP_SCHEDULER_DAILY_ENABLED:-false}"
      APP_SCHEDULER_DAILY_CRON: "${APP_SCHEDULER_DAILY_CRON:-0 20 16 ? * MON-FRI}"
      APP_NOTIFICATION_RECIPIENTS: "${APP_NOTIFICATION_RECIPIENTS:-}"
      APP_NOTIFICATION_FROM: "${APP_NOTIFICATION_FROM:-}"
      APP_NOTIFICATION_SENDER_NAME: "${APP_NOTIFICATION_SENDER_NAME:-Stock Signal Tracker}"
      APP_NOTIFICATION_HOURLY_INCLUDE_EMPTY: "${APP_NOTIFICATION_HOURLY_INCLUDE_EMPTY:-false}"
      APP_NOTIFICATION_DAILY_INCLUDE_EMPTY: "${APP_NOTIFICATION_DAILY_INCLUDE_EMPTY:-true}"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: stock-tracker-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  backend-data:
